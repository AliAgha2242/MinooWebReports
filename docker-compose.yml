services:
  minoo-web-reports:
    container_name: minoo-web-reports
    build:
      context: .
      dockerfile: Dockerfile
    image: minoo-web-reports:latest
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./AppConfig.json:/app/config/AppConfig.json:ro
      - ./Logs:/app/Logs
